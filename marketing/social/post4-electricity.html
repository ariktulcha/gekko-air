<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:'Heebo',sans-serif;background:#123D32;overflow:hidden}
.canvas{position:relative;width:1080px;height:1350px;display:flex;flex-direction:column}
.wave{position:absolute;inset:0;background:radial-gradient(900px 500px at 85% -10%,rgba(189,235,255,.14),transparent 60%),radial-gradient(700px 420px at 8% 108%,rgba(183,241,74,.12),transparent 60%)}
.top{position:relative;padding:60px 72px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:54px;height:54px;border-radius:50%;object-fit:cover}
.brand span{color:#F7FAF8;font-weight:800;font-size:24px;letter-spacing:.14em}
.tag{background:rgba(183,241,74,.14);border:1.5px solid rgba(183,241,74,.5);color:#B7F14A;border-radius:999px;padding:10px 24px;font-size:21px;font-weight:600}
.bottom{position:relative;margin-top:auto;padding:0 72px 60px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta{background:#B7F14A;color:#123D32;font-size:28px;font-weight:800;border-radius:999px;padding:20px 42px;white-space:nowrap}
.sub{color:#cfe0d8;font-size:23px;font-weight:600}

.big{position:relative;padding:70px 72px 0;text-align:center}
.big .num{color:#B7F14A;font-size:300px;font-weight:900;line-height:.95;letter-spacing:-.02em}
.big h1{color:#F7FAF8;font-size:52px;font-weight:800;line-height:1.25;margin-top:16px}
.calc{position:relative;margin:52px 72px 0;background:rgba(247,250,248,.07);border:1.5px solid rgba(247,250,248,.16);border-radius:24px;padding:34px 40px;display:flex;flex-direction:column;gap:16px}
.calc .row{display:flex;justify-content:space-between;color:#cfe0d8;font-size:26px}
.calc .row b{color:#F7FAF8}
.calc .row.hot b{color:#B7F14A;font-size:30px}
</style></head><body><div class="canvas"><div class="wave"></div>
<div class="top"><div class="brand"><img src="../../assets/fbfa2713-4181-473c-b6cf-42932f3d1a06.jpg" alt=""><span>GEKKO AIR</span></div><div class="tag">חיסכון בחשמל</div></div>

<div class="big"><div class="num">15%+</div><h1>ככה מזגן מלוכלך מנפח לכם<br>את חשבון החשמל</h1></div>
<div class="calc">
  <div class="row"><span>מיזוג בקיץ, 3 מזגנים</span><b>‎800–1,200 ₪ לחודש</b></div>
  <div class="row"><span>תוספת בגלל סוללה חסומה</span><b>עד 15%</b></div>
  <div class="row hot"><span>ניקוי אחד עם הערכה</span><b>מחזיר את עצמו בעונה</b></div>
</div>

<div class="bottom"><div class="sub">₪249 · פעם אחת · לכל המזגנים</div><div class="cta">לערכה המלאה ←</div></div>
</div></body></html>
