<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gekko Air | האתר תחת בנייה</title>
  <meta name="description" content="האתר של Gekko Air נמצא כרגע תחת בנייה. נחזור בקרוב.">
  <link rel="canonical" href="https://gekkoair.co.il/">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root {
      --green: #123D32;
      --green-dark: #0d2b23;
      --lime: #B7F14A;
      --bg: #F7FAF8;
      --ink: #1F2524;
      --muted: #5a6963;
      --line: rgba(18,61,50,.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 10% 0%, rgba(183,241,74,.28), transparent 30%),
        radial-gradient(circle at 90% 12%, rgba(189,235,255,.42), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(720px, 100%);
      text-align: center;
      background: rgba(255,255,255,.82);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: clamp(34px, 8vw, 72px) clamp(22px, 6vw, 56px);
      box-shadow: 0 28px 80px -44px rgba(18,61,50,.45);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      color: var(--green);
      font-weight: 900;
      letter-spacing: .12em;
      font-size: clamp(18px, 3vw, 24px);
    }
    .mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      color: var(--lime);
      font-size: 26px;
      box-shadow: 0 0 0 8px rgba(183,241,74,.18);
    }
    h1 {
      color: var(--green);
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.12;
      letter-spacing: -.03em;
      margin-bottom: 18px;
    }
    p {
      color: var(--muted);
      font-size: clamp(18px, 3vw, 22px);
      max-width: 540px;
      margin: 0 auto;
    }
    .badge {
      display: inline-flex;
      margin-top: 30px;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(183,241,74,.2);
      color: var(--green-dark);
      border: 1px solid rgba(18,61,50,.12);
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="brand" aria-label="Gekko Air">
      <span class="mark" aria-hidden="true">G</span>
      <span>GEKKO AIR</span>
    </div>
    <h1 id="page-title">היי, האתר שלנו תחת בנייה</h1>
    <p>נחזור בקרוב.</p>
    <div class="badge">תודה על הסבלנות</div>
  </main>
</body>
</html>
